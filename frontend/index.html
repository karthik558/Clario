<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clario — Every document. A clearer answer.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      #clario-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0F1D30;
        color: #F8F7F3;
        font-family: 'Inter', system-ui, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #clario-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(169, 213, 195, 0.2);
        border-top-color: #477E88;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-clario-ivory text-clario-text antialiased selection:bg-clario-sage selection:text-clario-navy">
    <!-- Simple Preloader -->
    <div id="clario-preloader">
      <div class="preloader-spinner"></div>
      <div style="font-weight: 700; font-size: 16px; letter-spacing: -0.02em; color: #FFFFFF; margin-bottom: 4px;">
        Clario
      </div>
      <div style="font-size: 11px; color: #A9D5C3; letter-spacing: 0.05em; font-weight: 500;">
        Every document. A clearer answer.
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide preloader once React DOM is mounted
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const preloader = document.getElementById('clario-preloader');
          if (preloader) {
            preloader.classList.add('fade-out');
            setTimeout(() => preloader.remove(), 400);
          }
        }, 150);
      });
    </script>
  </body>
</html>
